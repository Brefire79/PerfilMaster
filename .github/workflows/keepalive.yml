name: keepalive

# Por que existe:
# Em 27/07/2026 o Perfil Master saiu do ar. Não foi bug — o projeto Supabase
# (Free tier) tinha sido PAUSADO por inatividade, e o app, sem timeout em
# lugar nenhum, ficava em "Carregando..." para sempre. O timeout foi corrigido
# (C1), mas a causa continua: sem tráfego, o projeto pausa de novo.
#
# Revisão de 24/08/2026:
#  - O ping batia em /auth/v1/health, atendido pelo gateway, que pode NÃO contar
#    como atividade no Postgres. Agora chama a RPC public.ping() via PostgREST,
#    que força uma consulta real ao banco (ver
#    supabase/migrations/20260824_keepalive_ping.sql).
#  - Passou de 3 em 3 dias para diário. Actions é gratuito e ilimitado em
#    repositório público, e uma folga maior só aumenta o risco.
#
# ATENÇÃO — este workflow NÃO basta sozinho: o GitHub desativa workflows
# agendados após 60 dias sem atividade no repositório. Um app que fica meses sem
# commit perde o cron em silêncio. Por isso existe um segundo pinger externo
# (cron-job.org), independente do GitHub. Mantenha os dois.
#
# Requer o secret do repositório: SUPABASE_ANON_KEY
# (Settings > Secrets and variables > Actions > New repository secret)
# A chave anon é pública por design — já vai no bundle do frontend. Quem protege
# os dados é o RLS, não o sigilo dela.
#
# Alternativa definitiva: plano Pro, que não pausa.

on:
  schedule:
    # 09:00 UTC (06:00 em Brasília), todos os dias
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Acordar o Supabase
        env:
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PROJECT_URL: https://zlbynxjeefqxcgrsmkjp.supabase.co
        run: |
          if [ -z "$ANON_KEY" ]; then
            echo "::error::Secret SUPABASE_ANON_KEY não configurado no repositório."
            exit 1
          fi

          # RPC que só devolve now(): toca o Postgres de verdade, sem ler dado algum.
          STATUS=$(curl -s -o /tmp/resposta -w "%{http_code}" --max-time 30 \
            -X POST \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$PROJECT_URL/rest/v1/rpc/ping")

          echo "HTTP $STATUS"
          cat /tmp/resposta || true
          echo

          if [ "$STATUS" = "404" ] || [ "$STATUS" = "403" ]; then
            echo "::error::A RPC public.ping() não existe ou não foi liberada para anon. Rode RODAR-NO-SUPABASE-KEEPALIVE.sql no SQL Editor."
            exit 1
          fi

          if [ "$STATUS" != "200" ]; then
            echo "::warning::Supabase respondeu $STATUS — pode estar pausado. Verifique o dashboard."
            exit 1
          fi

          echo "Projeto ativo."

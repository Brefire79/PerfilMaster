[build]
  publish = "dist"
  command  = "npm run build"

# C2 (auditoria 27/07/2026): o bloco [functions] e o redirect /api/* foram
# REMOVIDOS. A única Netlify Function era `generate-profile-analysis`, um proxy
# DeepSeek SEM autenticação e com CORS "*" — qualquer pessoa podia chamar
# /api/generate-profile-analysis e queimar a cota de IA. Pior: a única
# consumidora (src/lib/apiKeyManager.js → generateAnalysis) não era chamada por
# nenhuma tela; a IA dos relatórios roda pela Edge Function `insightPerfil`.
# Sem o [functions], a Netlify deixa de publicar qualquer função deste repo.
# Se um dia voltar a existir função aqui, ela precisa exigir JWT do Supabase,
# CORS restrito ao domínio próprio, limite de body e rate limit.

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"

# ─── Security headers (M-1 da auditoria) ──────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://fonts.googleapis.com https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
